name: Build and publish GHCR images

on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write

concurrency:
  group: ghcr-main
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/${{ github.repository_owner }}/llm-gateway

jobs:
  publish:
    name: Publish Manifest and Vertex sidecar images
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1

      - name: Log in to GHCR
        uses: docker/login-action@184bdaa0721073962dff0199f1fb9940f07167d1 # v3.5.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@c1e51972afc2121e065aed6d45c65596fe445f3f # v5.8.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest
            type=raw,value=main
            type=sha,format=long

      - name: Build and push Manifest image
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=manifest-amd64
          cache-to: type=gha,mode=max,scope=manifest-amd64
          sbom: true
          provenance: mode=max

      - name: Build and push Vertex token-refresh image
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: docker/vertex-token-refresh
          file: docker/vertex-token-refresh/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}/vertex-token-refresh:latest
            ${{ env.IMAGE }}/vertex-token-refresh:main
            ${{ env.IMAGE }}/vertex-token-refresh:sha-${{ github.sha }}
          cache-from: type=gha,scope=vertex-token-refresh-amd64
          cache-to: type=gha,mode=max,scope=vertex-token-refresh-amd64
          sbom: true
          provenance: mode=max

      - name: Print immutable image references
        run: |
          docker buildx imagetools inspect "${IMAGE}:main"
          docker buildx imagetools inspect "${IMAGE}/vertex-token-refresh:main"
